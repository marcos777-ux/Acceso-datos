services:
  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: prueba_db
      POSTGRES_USER: makro
      POSTGRES_PASSWORD: makro
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U makro -d prueba_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: